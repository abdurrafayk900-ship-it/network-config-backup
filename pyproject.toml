[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbackup"
version = "1.0.0"
description = "Multi-vendor network configuration backup with change detection"
requires-python = ">=3.9"
dependencies = ["netmiko>=4.3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
netbackup = "netbackup.cli:main"

[tool.setuptools]
packages = ["netbackup"]

[tool.ruff]
line-length = 110
